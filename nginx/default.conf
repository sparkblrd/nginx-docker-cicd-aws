# JSON access log (удобно для сбора логов: Loki, CloudWatch, ELK).
# log_format должен быть в контексте http; conf.d/*.conf подключается именно туда.
log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"'
  '}';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # В образе /var/log/nginx/access.log -> /dev/stdout, поэтому логи видны в `docker logs`
    access_log /var/log/nginx/access.log json_combined;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Healthcheck для Docker и мониторинга (без записи в лог)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SHA задеплоенного коммита; нужен для smoke-теста в pipeline
    location = /version.txt {
        default_type text/plain;
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
