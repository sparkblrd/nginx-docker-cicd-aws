<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World!</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 .5rem; }
    p  { margin: .25rem 0; color: #94a3b8; }
    code { background: #1e293b; padding: .15rem .5rem; border-radius: .4rem; color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>Deployed commit: <code id="version">loading…</code></p>
  </main>
  <script>
    fetch('/version.txt', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : 'unknown'; })
      .then(function (t) { document.getElementById('version').textContent = t.trim().slice(0, 7) || 'unknown'; })
      .catch(function () { document.getElementById('version').textContent = 'unknown'; });
  </script>
</body>
</html>
